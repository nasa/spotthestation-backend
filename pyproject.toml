[project]
name = "nasa-sts-backend"
version = "0.1.0"
description = "STS App Backend"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4~=4.12.3",
    "blinker~=1.9.0",
    "datetime~=5.0",
    "Flask~=3.1.3",
    "Flask-Mail~=0.9.1",
    "numpy~=1.22.4",
    "python-dateutil~=2.8.2",
    "python-dotenv~=1.2.2",
    "redis~=4.5.4",
    "requests~=2.33.0",
    "requests-cache~=0.9",
    "skyfield~=1.45",
    "splines~=0.3.0",
    "urllib3~=2.7.0",
    "boto3~=1.37.20",
    "gunicorn>=26.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-xdist>=3.8.0",
    "pytest-mock>=3.14",
    "ruff>=0.15.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"
fix = true

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations/versions",
    ".pytest_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "B",
    "UP",
    "C4",
    "SIM",
    "TCH",
    "RUF",
]

ignore = [
    "E501",
    "B008",
    "B904",
    "N806",
    "UP007",
]

# helpers.py ports IAU SOFA routines and uses standard astrodynamics
# notation (iau*, GCRF/ITRF/ECI/ECEF frame names, UT1_UTC/TAI_UTC/MJD
# timescale acronyms). Keep those canonical names rather than lowercasing.
[tool.ruff.lint.per-file-ignores]
"rest/services/helpers.py" = ["N802", "N803"]

fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-single-line = false
force-wrap-aliases = true
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
